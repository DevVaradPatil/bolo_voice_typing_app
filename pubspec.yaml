name: bolo
description: "Bolo: voice typing in Indian languages, anywhere."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
